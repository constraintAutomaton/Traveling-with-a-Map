<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- ============ PANEL A : baseline ============ -->
  <!-- query in -->
  <text x="200" y="30" text-anchor="middle" font-size="15">query <tspan font-style="italic">Q</tspan></text>
  <line x1="200" y1="36" x2="200" y2="76" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- network box -->
  <rect x="50" y="55" width="300" height="270" rx="26" ry="26" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- edges (center to center, circles drawn on top) -->
  <g stroke="#000000" stroke-width="1.5">
    <line x1="200" y1="95" x2="110" y2="175"/>
    <line x1="200" y1="95" x2="200" y2="175"/>
    <line x1="200" y1="95" x2="290" y2="175"/>
    <line x1="200" y1="175" x2="150" y2="265"/>
    <line x1="200" y1="175" x2="230" y2="265"/>
    <line x1="290" y1="175" x2="290" y2="265"/>
    <line x1="110" y1="175" x2="110" y2="265"/>
  </g>
  <!-- nodes : all dereferenced (green) -->
  <g stroke="#82b366" stroke-width="1.5" fill="#d5e8d4">
    <circle cx="200" cy="95" r="16"/>
    <circle cx="110" cy="175" r="16"/>
    <circle cx="200" cy="175" r="16"/>
    <circle cx="290" cy="175" r="16"/>
    <circle cx="150" cy="265" r="16"/>
    <circle cx="230" cy="265" r="16"/>
    <circle cx="290" cy="265" r="16"/>
    <circle cx="110" cy="265" r="16"/>
  </g>
  <!-- relevant checks on B(110,175) and D(290,175) -->
  <g fill="none" stroke="#3b8df1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 103,175 l 4,5 l 11,-14"/>
    <path d="M 283,175 l 4,5 l 11,-14"/>
  </g>
  <text x="200" y="348" text-anchor="middle" font-size="14" font-weight="bold">(a) Baseline traversal</text>

  <!-- ============ PANEL B : pruning ============ -->
  <text x="560" y="30" text-anchor="middle" font-size="15">query <tspan font-style="italic">Q</tspan></text>
  <line x1="560" y1="36" x2="560" y2="76" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="410" y="55" width="300" height="270" rx="26" ry="26" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <g stroke="#000000" stroke-width="1.5">
    <line x1="560" y1="95" x2="470" y2="175"/>
    <line x1="560" y1="95" x2="560" y2="175"/>
    <line x1="560" y1="95" x2="650" y2="175"/>
    <line x1="560" y1="175" x2="510" y2="265"/>
    <line x1="560" y1="175" x2="590" y2="265"/>
    <line x1="650" y1="175" x2="650" y2="265"/>
    <line x1="470" y1="175" x2="470" y2="265"/>
  </g>
  <!-- pruned (white) : C,E,F,G,H -->
  <g stroke="#000000" stroke-width="1.5" fill="#ffffff">
    <circle cx="560" cy="175" r="16"/>
    <circle cx="510" cy="265" r="16"/>
    <circle cx="590" cy="265" r="16"/>
    <circle cx="650" cy="265" r="16"/>
    <circle cx="470" cy="265" r="16"/>
  </g>
  <!-- dereferenced (green) : A(entry),B,D -->
  <g stroke="#82b366" stroke-width="1.5" fill="#d5e8d4">
    <circle cx="560" cy="95" r="16"/>
    <circle cx="470" cy="175" r="16"/>
    <circle cx="650" cy="175" r="16"/>
  </g>
  <!-- relevant checks on B(470,175) and D(650,175) -->
  <g fill="none" stroke="#3b8df1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 463,175 l 4,5 l 11,-14"/>
    <path d="M 643,175 l 4,5 l 11,-14"/>
  </g>
  <text x="560" y="348" text-anchor="middle" font-size="14" font-weight="bold">(b) With shape-index pruning</text>

  <!-- ============ legend ============ -->
  <g font-size="13">
    <circle cx="150" cy="378" r="9" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
    <text x="164" y="382">dereferenced</text>
    <circle cx="330" cy="378" r="9" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
    <path d="M 326,378 l 2.5,3 l 6,-8" fill="none" stroke="#3b8df1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="344" y="382">query-relevant</text>
    <circle cx="520" cy="378" r="9" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="534" y="382">not dereferenced (pruned)</text>
  </g>
</svg>
